async function sha256(msg){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
let data=JSON.parse(JSON.stringify(DEFAULT));
let editingDay=null,pwMode='',pwResolve=null;

async function cloudGet(){try{const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':MASTER_KEY}});if(!r.ok)return null;const j=await r.json();return j.record||null;}catch(e){return null;}}
async function cloudPut(d){try{const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},body:JSON.stringify(d)});return r.ok;}catch(e){return false;}}
function getColHeaders(){return data.colHeaders||DEFAULT.colHeaders;}

function openPwModal(mode){
  pwMode=mode;
  document.getElementById('pwTitle').textContent=mode==='setup'?'🔐 ตั้งรหัสผ่าน':'🔐 ใส่รหัสผ่าน';
  document.getElementById('pwDesc').textContent=mode==='setup'?'ตั้งรหัสผ่านสำหรับการแก้ไข Agenda':'กรอกรหัสผ่านเพื่อแก้ไข Agenda';
  document.getElementById('pwInput').value='';
  document.getElementById('pwError').style.display='none';
  document.getElementById('pwModal').classList.add('show');
  setTimeout(()=>document.getElementById('pwInput').focus(),100);
  return new Promise(res=>{pwResolve=res;});
}
function closePwModal(){document.getElementById('pwModal').classList.remove('show');if(pwResolve)pwResolve(false);pwResolve=null;}
async function submitPw(){
  const val=document.getElementById('pwInput').value;if(!val)return;
  if(pwMode==='setup'){const h=await sha256(val);localStorage.setItem('agenda_pw_hash',h);document.getElementById('pwModal').classList.remove('show');if(pwResolve)pwResolve(true);pwResolve=null;}
  else{const stored=localStorage.getItem('agenda_pw_hash');const h=await sha256(val);if(h===stored){document.getElementById('pwModal').classList.remove('show');if(pwResolve)pwResolve(true);pwResolve=null;}else{document.getElementById('pwError').style.display='block';}}
}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPw();});

function trapEnterKey(el,multiline){
  el.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      if(!multiline){e.preventDefault();el.blur();return;}
      e.preventDefault();
      const sel=window.getSelection();if(!sel.rangeCount)return;
      const range=sel.getRangeAt(0);range.deleteContents();
      const tn=document.createTextNode('\n');range.insertNode(tn);
      range.setStartAfter(tn);range.setEndAfter(tn);
      sel.removeAllRanges();sel.addRange(range);
    }
  });
}

}

      <div class="toolbar">
        <span class="sync-status" id="sync-${di}"></span>
        <button class="btn-edit" onclick="startEdit(${di})">✏️ แก้ไข</button>
      </div>
      <div class="scroll-hint">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Scroll to see all columns
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="table-scroll">
        <div class="table-inner">
          <div class="col-labels" id="col-labels-${di}">
            <span class="c-time">${ch.time}</span>
            <span class="c-details">${ch.detail}</span>
            <span class="c-att">${ch.att}</span>
            <span class="c-note">${ch.note}</span>
          </div>
          <div class="day-body" id="body-${di}"></div>
        </div>
      </div>`;
    pages.appendChild(pg);
    renderBody(di);
  });
}

function renderHeaderEdit(di){
  const day=data.days[di];const ch=getColHeaders();
  const hcard=document.getElementById('hcard-'+di);
  let ex=hcard.querySelector('.header-edit-area');if(ex)ex.remove();
  let ex2=document.getElementById('col-header-edit-'+di);if(ex2)ex2.remove();
  const ea=document.createElement('div');ea.className='header-edit-area';
  ea.innerHTML=`
    <div class="hef-label"><label>Tab Label</label><input id="hef-label-${di}" type="text" value="${day.label}"/></div>
    <div class="hef-title"><label>Title</label><input id="hef-title-${di}" type="text" value="${day.title}"/></div>
    <div class="hef-date"><label>Date</label><input id="hef-date-${di}" type="text" value="${day.date}"/></div>`;
  hcard.appendChild(ea);
  const tableScroll=document.querySelector('#page-'+di+' .table-scroll');
  const che=document.createElement('div');che.className='col-header-edit';che.id='col-header-edit-'+di;
  che.innerHTML=`
    <div class="section-label">Edit Column Headers</div>
    <div class="che-time"><label>Col 1</label><input id="che-time-${di}" type="text" value="${ch.time}"/></div>
    <div class="che-detail"><label>Col 2</label><input id="che-detail-${di}" type="text" value="${ch.detail}"/></div>
    <div class="che-att"><label>Col 3</label><input id="che-att-${di}" type="text" value="${ch.att}"/></div>
    <div class="che-note"><label>Col 4</label><input id="che-note-${di}" type="text" value="${ch.note}"/></div>`;
  tableScroll.parentNode.insertBefore(che,tableScroll);
  document.getElementById('hef-label-'+di).addEventListener('input',function(){day.label=this.value;const tb=document.getElementById('tab-btn-'+di);if(tb)tb.textContent=this.value;});
  document.getElementById('hef-title-'+di).addEventListener('input',function(){day.title=this.value;const el=document.getElementById('hday-title-'+di);if(el)el.textContent=this.value;});
  document.getElementById('hef-date-'+di).addEventListener('input',function(){
    day.date=this.value;const parts=this.value.split(',');
    const wk=document.getElementById('hday-weekday-'+di);const dr=document.getElementById('hday-daterest-'+di);
    if(wk)wk.textContent=parts[0]||'';if(dr)dr.textContent=parts.slice(1).join(',').trim();
  });
  document.getElementById('che-time-'+di).addEventListener('input',function(){if(!data.colHeaders)data.colHeaders={...DEFAULT.colHeaders};data.colHeaders.time=this.value;renderColLabels(di);});
  document.getElementById('che-detail-'+di).addEventListener('input',function(){if(!data.colHeaders)data.colHeaders={...DEFAULT.colHeaders};data.colHeaders.detail=this.value;renderColLabels(di);});
  document.getElementById('che-att-'+di).addEventListener('input',function(){if(!data.colHeaders)data.colHeaders={...DEFAULT.colHeaders};data.colHeaders.att=this.value;renderColLabels(di);});
  document.getElementById('che-note-'+di).addEventListener('input',function(){if(!data.colHeaders)data.colHeaders={...DEFAULT.colHeaders};data.colHeaders.note=this.value;renderColLabels(di);});
}
function removeHeaderEdit(di){
  const hcard=document.getElementById('hcard-'+di);if(hcard){const ea=hcard.querySelector('.header-edit-area');if(ea)ea.remove();}
  const che=document.getElementById('col-header-edit-'+di);if(che)che.remove();
}

function renderBody(di){
  const day=data.days[di];
  const container=document.getElementById('body-'+di);
  container.innerHTML='';
  const isEdit=editingDay===di;
  if(isEdit)container.classList.add('edit-on');else container.classList.remove('edit-on');
  day.items.forEach((item,idx)=>{
    if(item.type==='zone'){
      const zr=document.createElement('div');zr.className='location-row';
      zr.innerHTML=`<span class="pin">📍</span><span class="loc-text${isEdit?' editable':''}" id="loc-${di}-${idx}" ${isEdit?'contenteditable="true"':''}>${item.loc||''}</span><div class="loc-controls"><button class="btn-del" onclick="delItem(${di},${idx})">✕ ลบโซน</button></div>`;
      container.appendChild(zr);
      if(isEdit){const el=zr.querySelector('.loc-text');trapEnterKey(el,false);el.addEventListener('input',()=>{item.loc=el.innerText.trim();});}
    } else {
      const row=document.createElement('div');row.className='item-row';
      row.innerHTML=`
        <div class="c-time">
          <span${isEdit?' class="editable"':''} id="time-${di}-${idx}" ${isEdit?'contenteditable="true"':''}>${item.time||''}</span>
          <span class="dur${isEdit?' editable':''}" id="dur-${di}-${idx}" ${isEdit?'contenteditable="true"':''}>${item.dur||''}</span>
        </div>
        <div class="c-details${isEdit?' editable':''}" id="det-${di}-${idx}" ${isEdit?'contenteditable="true"':''}>${item.detail||''}</div>
        <div class="c-att${isEdit?' editable':''}" id="att-${di}-${idx}" ${isEdit?'contenteditable="true"':''}>${item.att||''}</div>
        <div class="c-note${isEdit?' editable':''}" id="note-${di}-${idx}" ${isEdit?'contenteditable="true"':''}>${item.note||''}</div>
        <div class="row-controls">
          <button class="btn-add-row" onclick="addRow(${di},${idx})">+ แถว</button>
          <button class="btn-add-zone" onclick="addZone(${di},${idx})">+ โซน</button>
          <button class="btn-del" onclick="delItem(${di},${idx})">✕</button>
        </div>`;
      container.appendChild(row);
      if(isEdit){
        const tE=document.getElementById('time-'+di+'-'+idx),dE=document.getElementById('dur-'+di+'-'+idx);
        const detE=document.getElementById('det-'+di+'-'+idx),aE=document.getElementById('att-'+di+'-'+idx),nE=document.getElementById('note-'+di+'-'+idx);
        trapEnterKey(tE,false);trapEnterKey(dE,false);trapEnterKey(detE,true);trapEnterKey(aE,true);trapEnterKey(nE,true);
        tE.addEventListener('input',()=>{item.time=tE.innerText.trim();});
        dE.addEventListener('input',()=>{item.dur=dE.innerText.trim();});
        detE.addEventListener('input',()=>{item.detail=detE.innerText;});
        aE.addEventListener('input',()=>{item.att=aE.innerText;});
        nE.addEventListener('input',()=>{item.note=nE.innerText;});
      }
    }
  });
  if(isEdit){
    const addBtns=document.createElement('div');addBtns.style.cssText='display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;';
    addBtns.innerHTML=`<button class="btn-add-row" style="padding:8px 18px;font-size:13px;" onclick="addRow(${di},-1)">+ เพิ่มรายการ</button><button class="btn-add-zone" style="padding:8px 18px;font-size:13px;" onclick="addZone(${di},-1)">+ เพิ่มโซนสถานที่</button>`;
    container.appendChild(addBtns);
  }
}

function addRow(di,ai){const n={type:'row',time:'',dur:'',detail:'',att:'',note:''};if(ai===-1)data.days[di].items.push(n);else data.days[di].items.splice(ai+1,0,n);renderBody(di);}
function addZone(di,ai){const n={type:'zone',loc:'สถานที่...'};if(ai===-1)data.days[di].items.push(n);else data.days[di].items.splice(ai+1,0,n);renderBody(di);}
function delItem(di,idx){data.days[di].items.splice(idx,1);renderBody(di);}

async function startEdit(di){
  const stored=localStorage.getItem('agenda_pw_hash');
  if(!stored){const ok=await openPwModal('setup');if(!ok)return;}
  else{const ok=await openPwModal('verify');if(!ok)return;}
  editingDay=di;
  document.getElementById('page-'+di).querySelector('.toolbar').innerHTML=`<span class="sync-status" id="sync-${di}"></span><button class="btn-save" onclick="saveEdit(${di})">💾 บันทึก</button><button class="btn-cancel" onclick="cancelEdit(${di})">ยกเลิก</button>`;
  renderHeaderEdit(di);renderBody(di);
}
async function saveEdit(di){
  const stat=document.getElementById('sync-'+di);stat.textContent='กำลังบันทึก...';stat.className='sync-status';
  const ok=await cloudPut(data);
  if(ok){stat.textContent='✓ บันทึกแล้ว';stat.className='sync-status sync-ok';}
  else{stat.textContent='⚠ บันทึก Cloud ไม่สำเร็จ';stat.className='sync-status sync-err';}
  editingDay=null;removeHeaderEdit(di);
  const msg=stat.textContent;
  document.getElementById('page-'+di).querySelector('.toolbar').innerHTML=`<span class="sync-status" id="sync-${di}">${msg}</span><button class="btn-edit" onclick="startEdit(${di})">✏️ แก้ไข</button>`;
  renderBody(di);
}
async function cancelEdit(di){
  editingDay=null;removeHeaderEdit(di);
  const pg=document.getElementById('page-'+di);
  pg.querySelector('.toolbar').innerHTML=`<span class="sync-status" id="sync-${di}">Loading latest data...</span><button class="btn-edit" onclick="startEdit(${di})" disabled>✏️ แก้ไข</button>`;
  const cloud=await cloudGet();
  if(cloud&&cloud.days){
    data=cloud;
    if(!data.colHeaders)data.colHeaders={...DEFAULT.colHeaders};
    data.days.forEach(day=>{day.items.forEach(item=>{if(item.type==='row'&&item.note===undefined)item.note='';});});
    renderAll();
  } else {
    renderBody(di);
    pg.querySelector('.toolbar').innerHTML=`<span class="sync-status" id="sync-${di}">Using local data</span><button class="btn-edit" onclick="startEdit(${di})">✏️ แก้ไข</button>`;
  }
}
async function init(){
  renderAll();
  const cloud=await cloudGet();
  if(cloud&&cloud.days){
    data=cloud;
    if(!data.colHeaders)data.colHeaders={...DEFAULT.colHeaders};
    data.days.forEach(day=>{day.items.forEach(item=>{if(item.type==='row'&&item.note===undefined)item.note='';});});
    if(editingDay===null)renderAll();
  }
}
init();
</script>
</body>
</html>
