<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda – WD Leadership Offsite 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy-deep:#0a1a3a;--navy:#12275a;--accent:#1a4fd6;--pin-red:#e53e3e;--grad:linear-gradient(90deg,#2168FD 0%,#1E71FA 22%,#37B1D3 55%,#39D6CB 78%,#3AE4C9 100%);--grad-d:linear-gradient(135deg,#2168FD 0%,#37B1D3 50%,#3AE4C9 100%);--border:rgba(255,255,255,0.1);--muted:rgba(255,255,255,0.55);}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:'Manrope','Arial',sans-serif;background:#050d20;color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;}
.bg-art{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 85% 0%,rgba(120,170,255,0.35),transparent 45%),linear-gradient(160deg,#060e22 0%,#0a1a3a 60%,#091530 100%);}
.bg-art svg{position:absolute;inset:0;width:100%;height:100%;opacity:0.15;}

/* Config panel */
.cfg-panel{display:none;background:linear-gradient(90deg,rgba(33,104,253,.18),rgba(58,228,201,.08));border-bottom:1px solid rgba(33,104,253,.3);padding:12px 20px 14px;}
.cfg-panel.show{display:flex;}
.cfg-fields{display:flex;gap:10px;flex:1;flex-wrap:wrap;}
.cfg-input{flex:1;min-width:160px;padding:9px 13px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-family:'Manrope',sans-serif;font-size:13px;}
.cfg-input:focus{outline:none;border-color:#3AE4C9;}
.cfg-input::placeholder{color:rgba(255,255,255,0.35);}
.cfg-label{font-size:12px;font-weight:700;color:#93C5FD;letter-spacing:1px;white-space:nowrap;align-self:center;}
.btn-cfg{background:var(--grad);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Manrope',sans-serif;}
.btn-cfg:hover{opacity:0.85;}

/* Header */
header{padding:28px 24px 16px;max-width:960px;margin:0 auto;}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.header-left{}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#3AE4C9;margin-bottom:6px;}
.title-main{font-size:clamp(22px,4vw,36px);font-weight:900;letter-spacing:-1px;line-height:1.1;background:var(--grad-d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.title-sub{font-size:13px;color:var(--muted);margin-top:5px;font-weight:500;}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px;}
.btn-edit{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-family:'Manrope',sans-serif;transition:all .2s;}
.btn-edit:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);}
.btn-edit.active{background:var(--grad);border-color:transparent;color:#fff;}
.btn-save{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-family:'Manrope',sans-serif;transition:all .2s;}
.btn-save:hover{opacity:0.85;}
.btn-cloud-load{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid rgba(58,228,201,0.3);background:rgba(58,228,201,0.07);color:#3AE4C9;font-family:'Manrope',sans-serif;transition:all .2s;}
.btn-cloud-load:hover{background:rgba(58,228,201,0.14);}
.sync-status{font-size:11px;color:var(--muted);align-self:center;font-weight:600;}

/* Table */
.table-wrap{max-width:960px;margin:0 auto;padding:0 16px 40px;}
.section-block{margin-bottom:6px;}

/* Zone header row */
.zone-header-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-bottom:0;}
.zone-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#3AE4C9;padding:10px 12px 4px;opacity:0.8;}
.zone-edit-input{background:rgba(255,255,255,0.08);border:1px solid rgba(58,228,201,0.3);border-radius:6px;color:#3AE4C9;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 10px;font-family:'Manrope',sans-serif;width:220px;}
.zone-edit-input:focus{outline:none;border-color:#3AE4C9;}
.zone-actions{display:flex;gap:4px;padding-right:4px;align-items:center;}

/* Column labels */
.col-labels{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:0;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:1px;}
.col-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#93C5FD;padding:5px 12px 5px;opacity:0.7;}

/* Data row */
.data-row{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:0;border-radius:8px;transition:background .15s;}
.data-row:hover{background:rgba(255,255,255,0.03);}
.cell{padding:10px 12px;font-size:14px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,0.04);}
.cell-time{color:#93C5FD;font-weight:700;font-size:13px;white-space:nowrap;}
.cell-activity{color:#fff;font-weight:600;}
.cell-detail{color:var(--muted);font-size:13px;white-space:pre-wrap;}
.cell-actions{padding:8px 6px;display:flex;align-items:center;justify-content:flex-end;gap:3px;border-bottom:1px solid rgba(255,255,255,0.04);}

/* Edit mode cells */
.edit-mode .cell-time .cell-in,
.edit-mode .cell-activity .cell-in{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-family:'Manrope',sans-serif;padding:6px 9px;width:100%;font-size:13px;font-weight:inherit;}
.edit-mode .cell-time .cell-in{color:#93C5FD;}
.edit-mode .cell-time .cell-in:focus,
.edit-mode .cell-activity .cell-in:focus{outline:none;border-color:#3AE4C9;}
.edit-mode .cell-detail .cell-ta{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:var(--muted);font-family:'Manrope',sans-serif;padding:6px 9px;width:100%;font-size:13px;resize:vertical;min-height:40px;line-height:1.5;}
.edit-mode .cell-detail .cell-ta:focus{outline:none;border-color:#3AE4C9;}

/* Row buttons */
.btn-row{width:24px;height:24px;border-radius:5px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all .15s;}
.btn-row-add{background:rgba(58,228,201,0.12);color:#3AE4C9;}
.btn-row-add:hover{background:rgba(58,228,201,0.25);}
.btn-row-del{background:rgba(229,62,62,0.12);color:#fc8181;}
.btn-row-del:hover{background:rgba(229,62,62,0.25);}
.btn-zone-add{background:rgba(58,228,201,0.1);color:#3AE4C9;border:1.5px dashed rgba(58,228,201,0.4);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;transition:all .2s;}
.btn-zone-add:hover{background:rgba(58,228,201,0.18);}
.btn-zone-del{background:rgba(229,62,62,0.1);color:#fc8181;border:1px solid rgba(229,62,62,0.25);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;transition:all .2s;}
.btn-zone-del:hover{background:rgba(229,62,62,0.2);}

/* Insert zone between sections */
.insert-zone-bar{display:none;text-align:center;padding:4px 0;}
.edit-mode .insert-zone-bar{display:block;}
.btn-insert-zone{background:transparent;color:rgba(58,228,201,0.5);border:1px dashed rgba(58,228,201,0.25);border-radius:6px;padding:3px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Manrope',sans-serif;transition:all .2s;}
.btn-insert-zone:hover{color:#3AE4C9;border-color:rgba(58,228,201,0.5);background:rgba(58,228,201,0.05);}

/* Row controls visibility */
.row-controls{display:none;}
.edit-mode .row-controls{display:flex;}

/* Zone header edit toggle */
.zone-name-view{cursor:default;}
.zone-name-edit{display:none;}
.edit-mode .zone-name-view{display:none;}
.edit-mode .zone-name-edit{display:block;}
.edit-mode .zone-actions{display:flex;}
.zone-actions{display:none;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-box{background:#0d1b3e;border:1px solid rgba(33,104,253,0.3);border-radius:16px;padding:32px;max-width:400px;width:90%;box-shadow:0 0 60px rgba(33,104,253,0.2);}
.modal-title{font-size:18px;font-weight:800;margin-bottom:8px;background:var(--grad-d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.modal-input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-family:'Manrope',sans-serif;font-size:14px;margin-bottom:12px;}
.modal-input:focus{outline:none;border-color:#3AE4C9;}
.modal-row{display:flex;gap:8px;}
.btn-modal-ok{flex:1;padding:11px;background:var(--grad);border:none;border-radius:8px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:'Manrope',sans-serif;}
.btn-modal-ok:hover{opacity:0.85;}
.btn-modal-cancel{padding:11px 18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;font-family:'Manrope',sans-serif;}
.btn-modal-cancel:hover{background:rgba(255,255,255,0.12);}
.modal-err{color:#fc8181;font-size:12px;margin-bottom:10px;min-height:18px;}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#0d1b3e;border:1px solid rgba(58,228,201,0.3);border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;color:#3AE4C9;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:640px){
  .col-labels{grid-template-columns:90px 1fr;}
  .data-row{grid-template-columns:90px 1fr;}
  .cell-detail,.cell-actions{display:none;}
  .col-label:nth-child(3),.col-label:nth-child(4){display:none;}
}
</style>
</head>
<body>
<div class="bg-art">
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg"><circle cx="900" cy="80" r="320" fill="none" stroke="rgba(33,104,253,0.08)" stroke-width="1"/><circle cx="900" cy="80" r="220" fill="none" stroke="rgba(58,228,201,0.06)" stroke-width="1"/><line x1="0" y1="350" x2="1200" y2="350" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></svg>
</div>

<!-- Config Panel (hidden until edit mode) -->
<div class="cfg-panel" id="cfgPanel">
  <div class="cfg-fields">
    <span class="cfg-label">⚙ JSONBin</span>
    <input class="cfg-input" id="cfgBinId" placeholder="BIN ID (e.g. 64ab...)" />
    <input class="cfg-input" id="cfgKey" placeholder="Master Key ($2a$10...)" type="password" />
    <button class="btn-cfg" onclick="saveCfg()">บันทึก &amp; โหลด</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-row">
    <div class="header-left">
      <div class="eyebrow">Western Digital · Operations Leadership</div>
      <div class="title-main">WD Leadership Offsite 2026</div>
      <div class="title-sub" id="subtitleEl">โหลดข้อมูล...</div>
    </div>
    <div class="header-actions">
      <span class="sync-status" id="syncStatus"></span>
      <button class="btn-cloud-load" onclick="cloudLoad()" title="โหลดจาก Cloud">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        โหลด Cloud
      </button>
      <button class="btn-edit" id="btnEdit" onclick="toggleEdit()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        ✎ แก้ไข
      </button>
      <button class="btn-save" id="btnSave" onclick="cloudSave()" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        💾 บันทึกขึ้น Cloud
      </button>
    </div>
  </div>
</header>

<!-- Table -->
<div class="table-wrap" id="tableWrap"></div>

<!-- Modals -->
<div class="modal-bg" id="modalPw" style="display:none;">
  <div class="modal-box">
    <div class="modal-title" id="modalPwTitle">ตั้งรหัสผ่าน</div>
    <div class="modal-sub" id="modalPwSub">กรุณาตั้งรหัสผ่านสำหรับโหมดแก้ไข (ครั้งแรก)</div>
    <div class="modal-err" id="modalPwErr"></div>
    <input class="modal-input" id="modalPwInput" type="password" placeholder="รหัสผ่าน..." />
    <div class="modal-row">
      <button class="btn-modal-ok" id="modalPwOk" onclick="modalPwConfirm()">ยืนยัน</button>
      <button class="btn-modal-cancel" onclick="closeModal('modalPw')">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalZone" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">เพิ่ม Zone ใหม่</div>
    <div class="modal-sub">ชื่อหัวข้อ Zone (เช่น DAY 1 · AFTERNOON)</div>
    <div class="modal-err" id="modalZoneErr"></div>
    <input class="modal-input" id="modalZoneInput" placeholder="ชื่อ Zone..." />
    <div class="modal-row">
      <button class="btn-modal-ok" onclick="modalZoneConfirm()">เพิ่ม Zone</button>
      <button class="btn-modal-cancel" onclick="closeModal('modalZone')">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let editMode = false;
let pwHash = localStorage.getItem('agenda_pw_hash') || null;
let binId = localStorage.getItem('agenda_bin_id') || '';
let masterKey = localStorage.getItem('agenda_master_key') || '';
let pendingInsertAfterZone = -1; // zone index to insert after (-1 = append)
let pendingPwAction = null; // 'edit' or 'setup'

let agendaData = {
  subtitle: "Venue · Date",
  zones: [
    {
      name: "DAY 1 · MORNING",
      rows: [
        { time: "08:00–09:00", activity: "ลงทะเบียน & รับประทานอาหารเช้า", detail: "Registration & Breakfast" },
        { time: "09:00–09:30", activity: "เปิดงาน & Welcome Remarks", detail: "โดย VP Operations" },
        { time: "09:30–10:30", activity: "Strategic Direction 2026", detail: "Key priorities, OKRs, and roadmap overview" },
        { time: "10:30–10:45", activity: "Coffee Break", detail: "" }
      ]
    },
    {
      name: "DAY 1 · AFTERNOON",
      rows: [
        { time: "13:00–14:30", activity: "Workshop: Operations Excellence", detail: "Group activity · แบ่ง 4 กลุ่ม" },
        { time: "14:30–15:00", activity: "นำเสนอผลลัพธ์", detail: "Each team presents findings" },
        { time: "15:00–15:15", activity: "Coffee Break", detail: "" },
        { time: "15:15–17:00", activity: "Action Planning", detail: "Define owners, timelines, and KPIs" }
      ]
    },
    {
      name: "DAY 2 · MORNING",
      rows: [
        { time: "08:30–09:00", activity: "Morning Check-in", detail: "Recap Day 1 highlights" },
        { time: "09:00–11:00", activity: "Leadership Forum", detail: "Open discussion · Q&A session" },
        { time: "11:00–12:00", activity: "Closing & Next Steps", detail: "Commitments, follow-up schedule, wrap-up" }
      ]
    }
  ]
};

// ─── Hash ─────────────────────────────────────────────────────────────────────
async function hashPw(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ─── Modal helpers ────────────────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ─── Password Modal ───────────────────────────────────────────────────────────
function openPwModal(action) {
  pendingPwAction = action;
  const isSetup = !pwHash;
  document.getElementById('modalPwTitle').textContent = isSetup ? 'ตั้งรหัสผ่าน' : 'ใส่รหัสผ่าน';
  document.getElementById('modalPwSub').textContent = isSetup ? 'ตั้งรหัสผ่านสำหรับโหมดแก้ไข (ครั้งแรก)' : 'กรุณาใส่รหัสผ่านเพื่อเข้าโหมดแก้ไข';
  document.getElementById('modalPwErr').textContent = '';
  document.getElementById('modalPwInput').value = '';
  document.getElementById('modalPw').style.display = 'flex';
  setTimeout(() => document.getElementById('modalPwInput').focus(), 100);
}

async function modalPwConfirm() {
  const val = document.getElementById('modalPwInput').value.trim();
  if (!val) { document.getElementById('modalPwErr').textContent = 'กรุณาใส่รหัสผ่าน'; return; }
  const h = await hashPw(val);
  if (!pwHash) {
    pwHash = h; localStorage.setItem('agenda_pw_hash', h);
    closeModal('modalPw'); showToast('✅ ตั้งรหัสผ่านเรียบร้อยแล้ว');
    activateEdit();
  } else {
    if (h === pwHash) { closeModal('modalPw'); activateEdit(); }
    else { document.getElementById('modalPwErr').textContent = 'รหัสผ่านไม่ถูกต้อง ลองใหม่'; }
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('modalPw').style.display !== 'none') modalPwConfirm();
});

// ─── Edit Mode ────────────────────────────────────────────────────────────────
function toggleEdit() {
  if (editMode) { deactivateEdit(); }
  else { collectFromDOM(); openPwModal('edit'); }
