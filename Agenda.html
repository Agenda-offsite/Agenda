body{font-family:'Manrope','Arial',sans-serif;background:#050d20;color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;}

.tabs{display:flex;justify-content:center;gap:10px;padding:22px 16px 4px;flex-wrap:wrap;}

.tab-btn.active{background:#fff;color:var(--navy-deep);border-color:#fff;}
.page{max-width:1080px;margin:0 auto;padding:18px 16px 100px;display:none;}
.page.active{display:block;}
.header-card{background:linear-gradient(120deg,#f4f7fc 0%,#dbe6f5 100%);border-radius:8px;padding:26px 30px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,0.3);}
.agenda-title{font-size:44px;font-weight:900;color:var(--accent);letter-spacing:1px;line-height:1;margin:0;}
.day-title{font-size:34px;font-weight:900;color:#1c2b4a;line-height:1.1;margin:6px 0 0;}

.header-right .weekday{font-size:18px;font-weight:700;text-transform:uppercase;}

/* ── Column header bar with dividers ── */
.col-labels{

.col-labels span{

  position:relative;
}
.col-labels span + span::before{

  width:1px;
  background:rgba(147,197,253,0.25);

.col-labels .c-time{width:18%;}
.col-labels .c-details{flex:1;}

.col-labels .c-note{width:20%;}

.location-row .pin{color:var(--pin-red);font-size:16px;}

async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

let data=JSON.parse(JSON.stringify(DEFAULT));
let editingDay=null;
let pwMode='';
let pwResolve=null;

async function cloudGet(){
  try{
    const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':MASTER_KEY}});
    if(!r.ok)return null;
    const j=await r.json();
    return j.record||null;
  }catch(e){return null;}
}
async function cloudPut(d){
  try{
    const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},body:JSON.stringify(d)});
    return r.ok;
  }catch(e){return false;}
}

function openPwModal(mode){
  pwMode=mode;
  document.getElementById('pwTitle').textContent=mode==='setup'?'🔐 ตั้งรหัสผ่าน':'🔐 ใส่รหัสผ่าน';
  document.getElementById('pwDesc').textContent=mode==='setup'?'ตั้งรหัสผ่านสำหรับการแก้ไข Agenda':'กรอกรหัสผ่านเพื่อแก้ไข Agenda';
  document.getElementById('pwInput').value='';
  document.getElementById('pwError').style.display='none';
  document.getElementById('pwModal').classList.add('show');
  setTimeout(()=>document.getElementById('pwInput').focus(),100);
  return new Promise(res=>{pwResolve=res;});
}
function closePwModal(){
  document.getElementById('pwModal').classList.remove('show');
  if(pwResolve)pwResolve(false);
  pwResolve=null;
}
async function submitPw(){
  const val=document.getElementById('pwInput').value;
  if(!val)return;
  if(pwMode==='setup'){
    const h=await sha256(val);
    localStorage.setItem('agenda_pw_hash',h);
    document.getElementById('pwModal').classList.remove('show');
    if(pwResolve)pwResolve(true);
    pwResolve=null;
  } else {
    const stored=localStorage.getItem('agenda_pw_hash');
    const h=await sha256(val);
    if(h===stored){
      document.getElementById('pwModal').classList.remove('show');
      if(pwResolve)pwResolve(true);
      pwResolve=null;
    } else {
      document.getElementById('pwError').style.display='block';
    }
  }
}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPw();});

function trapEnterKey(el,multiline){
  el.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      if(!multiline){e.preventDefault();el.blur();return;}
      e.preventDefault();
      const sel=window.getSelection();
      if(!sel.rangeCount)return;
      const range=sel.getRangeAt(0);
      range.deleteContents();
      const textNode=document.createTextNode('\n');
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });
}

            data-di="${di}" data-idx="${idx}" data-field="time">${item.time||''}</span>
          <span class="dur editable${isEdit?' ':''}" id="dur-${di}-${idx}"
            ${isEdit?'contenteditable="true"':''}
            data-di="${di}" data-idx="${idx}" data-field="dur">${item.dur||''}</span>
        </div>
        <div class="c-details editable${isEdit?' ':''}" id="det-${di}-${idx}"
          ${isEdit?'contenteditable="true"':''}
          data-di="${di}" data-idx="${idx}" data-field="detail">${item.detail||''}</div>
        <div class="c-att editable${isEdit?' ':''}" id="att-${di}-${idx}"
          ${isEdit?'contenteditable="true"':''}
          data-di="${di}" data-idx="${idx}" data-field="att">${item.att||''}</div>
        <div class="c-note editable${isEdit?' ':''}" id="note-${di}-${idx}"
          ${isEdit?'contenteditable="true"':''}
          data-di="${di}" data-idx="${idx}" data-field="note">${item.note||''}</div>

          <button class="btn-del" onclick="delItem(${di},${idx})">✕</button>
        </div>`;
      container.appendChild(row);
      if(isEdit){
        const timeEl=document.getElementById('time-'+di+'-'+idx);

        trapEnterKey(timeEl,false);
        trapEnterKey(durEl,false);
        trapEnterKey(detEl,true);
        trapEnterKey(attEl,true);
        trapEnterKey(noteEl,true);
        timeEl.addEventListener('input',()=>{item.time=timeEl.innerText.trim();});
        durEl.addEventListener('input',()=>{item.dur=durEl.innerText.trim();});
        detEl.addEventListener('input',()=>{item.detail=detEl.innerText;});
        attEl.addEventListener('input',()=>{item.att=attEl.innerText;});
        noteEl.addEventListener('input',()=>{item.note=noteEl.innerText;});
      }
    }
  });

  if(isEdit){
    const addBtns=document.createElement('div');
    addBtns.style.cssText='display:flex;gap:10px;margin-top:14px;';
    addBtns.innerHTML=`
      <button class="btn-add-row" style="padding:8px 18px;font-size:13px;" onclick="addRow(${di},-1)">+ เพิ่มรายการ</button>
      <button class="btn-add-zone" style="padding:8px 18px;font-size:13px;" onclick="addZone(${di},-1)">+ เพิ่มโซนสถานที่</button>`;
    container.appendChild(addBtns);
  }
}

function addRow(di,afterIdx){
  const newItem={type:'row',time:'',dur:'',detail:'',att:'',note:''};
  if(afterIdx===-1)data.days[di].items.push(newItem);
  else data.days[di].items.splice(afterIdx+1,0,newItem);
  renderBody(di);
}
function addZone(di,afterIdx){
  const newItem={type:'zone',loc:'สถานที่...'};
  if(afterIdx===-1)data.days[di].items.push(newItem);
  else data.days[di].items.splice(afterIdx+1,0,newItem);
  renderBody(di);
}
function delItem(di,idx){
  data.days[di].items.splice(idx,1);
  renderBody(di);
}

async function startEdit(di){
  const stored=localStorage.getItem('agenda_pw_hash');
  if(!stored){
    const ok=await openPwModal('setup');
    if(!ok)return;
  } else {
    const ok=await openPwModal('verify');
    if(!ok)return;
  }
  editingDay=di;
  const pg=document.getElementById('page-'+di);
  pg.querySelector('.toolbar').innerHTML=`
    <span class="sync-status" id="sync-${di}"></span>
    <button class="toolbar button btn-save" onclick="saveEdit(${di})">💾 บันทึก</button>
    <button class="toolbar button btn-cancel" onclick="cancelEdit(${di})">ยกเลิก</button>`;
  renderBody(di);
}

async function saveEdit(di){
  const stat=document.getElementById('sync-'+di);
  stat.textContent='กำลังบันทึก...';
  stat.className='sync-status';
  const ok=await cloudPut(data);
  if(ok){stat.textContent='✓ บันทึกแล้ว';stat.className='sync-status sync-ok';}
  else{stat.textContent='⚠ บันทึก Cloud ไม่สำเร็จ';stat.className='sync-status sync-err';}
  editingDay=null;
  const pg=document.getElementById('page-'+di);
  pg.querySelector('.toolbar').innerHTML=`
    <span class="sync-status" id="sync-${di}">${stat.textContent}</span>
    <button class="toolbar button btn-edit" onclick="startEdit(${di})">✏️ แก้ไข</button>`;
  renderBody(di);
}

async function cancelEdit(di){
  editingDay=null;
  const pg=document.getElementById('page-'+di);
  pg.querySelector('.toolbar').innerHTML=`
    <span class="sync-status" id="sync-${di}">กำลังโหลดข้อมูลจาก Cloud...</span>
    <button class="toolbar button btn-edit" onclick="startEdit(${di})" disabled>✏️ แก้ไข</button>`;
  const cloud=await cloudGet();
  if(cloud&&cloud.days){
    data=cloud;
    data.days.forEach(day=>{
      day.items.forEach(item=>{
        if(item.type==='row'&&item.note===undefined)item.note='';
      });
    });
  }
  pg.querySelector('.toolbar').innerHTML=`
    <span class="sync-status" id="sync-${di}">✓ โหลดข้อมูลล่าสุดแล้ว</span>
    <button class="toolbar button btn-edit" onclick="startEdit(${di})">✏️ แก้ไข</button>`;
  renderBody(di);
}

async function init(){
  renderAll();
  const cloud=await cloudGet();
  if(cloud&&cloud.days){
    data=cloud;
    data.days.forEach(day=>{
      day.items.forEach(item=>{
        if(item.type==='row'&&item.note===undefined)item.note='';
      });
    });
    if(editingDay===null)renderAll();
  }
}
init();
</script>
</body>
</html>
